server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the live Spring Boot Cloud Run backend
    location /api/ {
        proxy_pass https://compounding-backend-850966046813.asia-south1.run.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host compounding-backend-850966046813.asia-south1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
