server:
  port: 8080

spring:
  application:
    name: compounding-life-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:compoundingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASS:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: compounding-life-group
      auto-offset-reset: earliest
      auto-startup: ${KAFKA_AUTO_STARTUP:false}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,readiness,liveness"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    kafka:
      enabled: false # Never let Kafka health check hang application probes
  info:
    env:
      enabled: true

jwt:
  secret: ${JWT_SECRET:CompoundingLifeLongevityHealthAndWealthSecretKey2026SecureStringWith256Bits}
  expirationMs: 86400000 # 24 hours

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models
