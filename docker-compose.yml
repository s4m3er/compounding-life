version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: compounding-life-backend
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-flash-lite-latest
    restart: unless-stopped
    networks:
      - compounding-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: compounding-life-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - compounding-network

networks:
  compounding-network:
    driver: bridge
