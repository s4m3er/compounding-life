name: PR Quality & Security Verification Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Stage 1: Secret Scanning (Gitleaks)
  # -----------------------------------------------------------
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # -----------------------------------------------------------
  # Stage 2: Backend Build, JUnit Tests & JaCoCo Coverage
  # -----------------------------------------------------------
  backend-test:
    name: Java 21 Backend Test & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run JUnit Tests with JaCoCo
        run: |
          cd backend
          mvn clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

  # -----------------------------------------------------------
  # Stage 3: Frontend TypeScript Validation & Build Verification
  # -----------------------------------------------------------
  frontend-check:
    name: React Frontend TypeScript & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck & Production Build
        run: |
          cd frontend
          npm run build

  # -----------------------------------------------------------
  # Stage 4: SCA (Software Composition Analysis) - Trivy Security Scan
  # -----------------------------------------------------------
  sca-vulnerability-scan:
    name: Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # -----------------------------------------------------------
  # Stage 5: SonarCloud Static Code Analysis (SAST)
  # -----------------------------------------------------------
  sonar-analysis:
    name: SonarCloud Code Analysis & SAST
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=s4m3er_compounding-life \
            -Dsonar.organization=s4m3er
